[project]
name = "safety-xai"
version = "0.3.0"
description = "Synonym swaps, toxicity classifiers, XAI explanations and a local SLM for school safety monitoring"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "captum>=0.7.0",
    "shap>=0.45.0",
    "lime>=0.2.0.1",
    "scikit-learn>=1.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2",
    "spacy>=3.8.14",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "nltk>=3.9.4",
    "sentence-transformers>=3.0.0",
    "krippendorff>=0.8.0",
    "wordfreq>=3.1.0",
    "ollama>=0.6.2",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# TextFooler and BAE baselines (script 07). TextAttack's sentence encoder needs TensorFlow.
attacks = [
    "textattack>=0.3.10",
    "tensorflow>=2.15.0",
    "tensorflow-hub>=0.16.0",
]
# Grammar-error count in script 05. Also needs Java installed.
grammar = [
    "language-tool-python>=2.8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # needed for the spaCy model wheel

[tool.hatch.build.targets.wheel]
packages = ["src/safety_xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# TextAttack pulls in an old flair that wants sentencepiece 0.1.95, which does not build on
# Windows + Python 3.12. Newer sentencepiece has ready-made wheels and works the same.
override-dependencies = ["sentencepiece>=0.2.0"]
